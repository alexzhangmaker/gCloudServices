<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2328" />
      <stop offset="100%" stop-color="#0f1115" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Border Inner Glow -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>

  <!-- Markdown Symbol Subtle Background Mark -->
  <path d="M 110 370 L 110 270 L 140 300 L 170 270 L 170 370" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.15"/>

  <!-- Typora Iconic Serif "T" -->
  <g fill="#ffffff">
    <!-- Top Horizontal Crossbar -->
    <path d="M 128 140 C 128 132, 134 126, 142 126 L 370 126 C 378 126, 384 132, 384 140 L 384 176 C 384 182, 378 186, 372 184 L 334 172 C 326 169, 320 174, 320 182 L 320 354 C 320 374, 334 380, 350 382 C 356 383, 360 388, 360 394 L 360 404 C 360 410, 354 414, 348 414 L 164 414 C 158 414, 152 410, 152 404 L 152 394 C 152 388, 156 383, 162 382 C 178 380, 192 374, 192 354 L 192 182 C 192 174, 186 169, 178 172 L 140 184 C 134 186, 128 182, 128 176 Z"/>
  </g>

  <!-- Accent Quill / Pen Dot at bottom right -->
  <circle cx="396" cy="380" r="26" fill="url(#accentGrad)"/>
  <path d="M 388 380 L 394 386 L 406 374" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

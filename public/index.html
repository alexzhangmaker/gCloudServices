<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Typora Web - Markdown Editor & Viewer</title>
  
  <!-- PWA & SEO Meta -->
  <meta name="description" content="Distraction-free seamless Markdown editor and viewer clone of Typora with offline PWA support and SQLite backend.">
  <meta name="theme-color" content="#24292e">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/icons/icon.svg">

  <!-- Core App & Typora Typography CSS -->
  <link rel="stylesheet" href="/css/typora-base.css">
  <link rel="stylesheet" href="/css/app.css">

  <!-- Typora Themes -->
  <link rel="stylesheet" href="/css/themes/github.css">
  <link rel="stylesheet" href="/css/themes/night.css">
  <link rel="stylesheet" href="/css/themes/gothic.css">
  <link rel="stylesheet" href="/css/themes/newsprint.css">
  <link rel="stylesheet" href="/css/themes/cobalt.css">

  <!-- KaTeX & Prism Syntax Styles -->
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/vendor/prism.css">
  <link rel="stylesheet" href="/vendor/prism-tomorrow.css">
</head>
<body class="theme-github">
  <div id="app">
    <!-- Top Titlebar & Toolbar -->
    <header class="top-header">
      <div class="header-left">
        <button id="btn-toggle-sidebar" class="btn-icon" title="Toggle Sidebar (Ctrl+Shift+L)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>

        <div class="brand-icon" title="Typora Web">
          <img src="/icons/icon.svg" alt="Typora Logo">
        </div>

        <input type="text" id="doc-title-input" class="doc-title-input" value="Welcome to Typora Web" placeholder="Document Title" title="Click to rename document" />
      </div>

      <div class="header-center">
        <!-- View Mode Segmented Control (Typora Live / Source Code / Split View) -->
        <div class="mode-segmented-control" role="group" aria-label="Editor View Mode">
          <button id="mode-live-btn" class="mode-btn active" title="Typora Seamless Live Preview">Live</button>
          <button id="mode-source-btn" class="mode-btn" title="Source Code Mode (Ctrl+/)">Source</button>
          <button id="mode-split-btn" class="mode-btn" title="Split View Mode">Split</button>
        </div>
      </div>

      <div class="header-right">
        <!-- Distraction Free Mode Buttons -->
        <button id="btn-focus-mode" class="btn-icon" title="Toggle Focus Mode (Dims other paragraphs)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
          <span>Focus</span>
        </button>

        <button id="btn-typewriter-mode" class="btn-icon" title="Toggle Typewriter Mode (Keeps active line centered)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
          <span>Typewriter</span>
        </button>

        <!-- Theme Selector -->
        <select id="theme-select" class="theme-select" title="Switch Typora Theme">
          <option value="github">GitHub</option>
          <option value="night">Night (Dark)</option>
          <option value="gothic">Gothic</option>
          <option value="newsprint">Newsprint</option>
          <option value="cobalt">Cobalt</option>
        </select>

        <!-- Document Operations -->
        <button id="btn-new-doc" class="btn-icon" title="Create New Document">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>New</span>
        </button>

        <button id="btn-versions" class="btn-icon" title="Version History & Revisions">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </button>

        <button id="btn-import-file" class="btn-icon" title="Import Markdown File (.md)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Import</span>
        </button>
        <input type="file" id="import-file-input" accept=".md,.markdown,text/markdown" style="display: none;" />

        <select id="export-select" class="action-select" title="Export Document">
          <option value="">Export ▾</option>
          <option value="md">Markdown (.md)</option>
          <option value="html">HTML Document (.html)</option>
          <option value="pdf">Print / PDF</option>
        </select>
      </div>
    </header>

    <!-- Main Container (Sidebar + Editor Workspace) -->
    <div class="main-container">
      <!-- Left Sidebar -->
      <aside id="sidebar" class="sidebar">
        <!-- Sidebar Tabs Navigation -->
        <div class="sidebar-tabs">
          <button class="sidebar-tab-btn active" data-tab="files" title="File Explorer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span>Files</span>
          </button>
          <button class="sidebar-tab-btn" data-tab="outline" title="Table of Contents Outline">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            <span>Outline</span>
          </button>
          <button class="sidebar-tab-btn" data-tab="search" title="Search Across Documents">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span>Search</span>
          </button>
        </div>

        <!-- Tab 1: Files List -->
        <div id="tab-files" class="sidebar-content">
          <div class="sidebar-toolbar">
            <span class="sidebar-title">Documents</span>
            <button id="btn-sidebar-new-doc" class="mini-btn" title="Create New Document">＋ New</button>
          </div>
          <ul id="doc-list" class="doc-list">
            <!-- Rendered by app.js -->
          </ul>
        </div>

        <!-- Tab 2: Outline (Table of Contents) -->
        <div id="tab-outline" class="sidebar-content" style="display: none;">
          <div class="sidebar-toolbar">
            <span class="sidebar-title">Outline (TOC)</span>
          </div>
          <ul id="outline-list" class="outline-list">
            <!-- Extracted headings rendered by markdown.js & app.js -->
          </ul>
        </div>

        <!-- Tab 3: Full-Text Search (SQLite FTS5) -->
        <div id="tab-search" class="sidebar-content" style="display: none;">
          <input type="text" id="search-input" class="search-input-box" placeholder="Search in documents..." />
          <div id="search-results">
            <!-- Search results rendered by app.js -->
          </div>
        </div>
      </aside>

      <!-- Editor Workspace -->
      <main id="editor-workspace" class="editor-workspace">
        <!-- Quick Formatting Ribbon -->
        <nav class="format-bar">
          <select id="fmt-heading-select" class="theme-select" style="padding: 2px 6px; font-size: 12px;">
            <option value="">Paragraph</option>
            <option value="1">Heading 1</option>
            <option value="2">Heading 2</option>
            <option value="3">Heading 3</option>
            <option value="4">Heading 4</option>
          </select>

          <div class="format-divider"></div>

          <button id="fmt-bold" class="format-btn" title="Bold (Ctrl+B)"><b>B</b></button>
          <button id="fmt-italic" class="format-btn" title="Italic (Ctrl+I)"><i>I</i></button>
          <button id="fmt-strike" class="format-btn" title="Strikethrough"><s>S</s></button>
          <button id="fmt-highlight" class="format-btn" title="Highlight (==mark==)"><mark>H</mark></button>
          <button id="fmt-code" class="format-btn" title="Inline Code"><code>&lt;&gt;</code></button>
          
          <div class="format-divider"></div>

          <button id="fmt-quote" class="format-btn" title="Blockquote">”</button>
          <button id="fmt-task" class="format-btn" title="Task List Checklist">☑</button>
          <button id="fmt-link" class="format-btn" title="Insert Link (Ctrl+K)">🔗</button>
          <button id="fmt-image" class="format-btn" title="Insert Image">🖼️</button>
          <button id="fmt-table" class="format-btn" title="Insert Table">⊞</button>
          <button id="fmt-math" class="format-btn" title="Insert Math Equation">∑</button>
          <button id="fmt-codeblock" class="format-btn" title="Insert Code Block">{ }</button>
        </nav>

        <!-- View Panels Wrapper -->
        <div class="views-wrapper">
          <!-- 1. Typora Live Mode (Seamless WYSIWYG) -->
          <div id="live-view-panel" class="view-panel active">
            <article id="live-editor-content" class="typora-editor-content" contenteditable="true" spellcheck="true">
              <!-- Live rendered contents -->
            </article>
          </div>

          <!-- 2. Source Code Mode -->
          <div id="source-view-panel" class="view-panel">
            <div class="source-editor-container">
              <div id="source-gutter" class="source-line-gutter">1<br>2<br>3</div>
              <textarea id="source-editor" class="source-textarea" spellcheck="false" placeholder="Write markdown here..."></textarea>
            </div>
          </div>

          <!-- 3. Split View Mode -->
          <div id="split-view-panel" class="view-panel">
            <div class="split-view-container">
              <div class="split-pane left-pane">
                <textarea id="split-editor" class="source-textarea" spellcheck="false" placeholder="Write markdown here..."></textarea>
              </div>
              <div class="split-pane right-pane">
                <article id="split-preview-content" class="typora-editor-content">
                  <!-- Live preview synchronized -->
                </article>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Bottom Status Bar -->
    <footer class="status-bar">
      <div class="status-left">
        <span id="stat-words" class="status-item">0 words</span>
        <span id="stat-chars" class="status-item">0 chars</span>
        <span id="stat-lines" class="status-item">0 lines</span>
        <span id="stat-read-time" class="status-item">1 min read</span>
      </div>

      <div class="status-right">
        <span id="save-status-text" class="status-item">Saved ✓</span>
        <div class="status-item">
          <span id="network-status-badge" class="status-badge" title="Network status"></span>
          <span id="network-status-text">Online</span>
        </div>
        <button id="btn-pwa-install" class="pwa-install-btn" title="Install as desktop/mobile PWA app">Install App</button>
      </div>
    </footer>
  </div>

  <!-- Revisions / Version History Modal -->
  <div id="version-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <span>Document Revisions</span>
        <button id="btn-close-version-modal" class="mini-btn">✕</button>
      </div>
      <div class="modal-body" style="max-height: 380px; overflow-y: auto;">
        <div id="version-list"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" onclick="document.getElementById('version-modal').classList.remove('open')">Close</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Vendor Libraries -->
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/prism.js"></script>
  <script src="/vendor/prism-components/prism-javascript.min.js"></script>
  <script src="/vendor/prism-components/prism-python.min.js"></script>
  <script src="/vendor/prism-components/prism-bash.min.js"></script>
  <script src="/vendor/prism-components/prism-sql.min.js"></script>
  <script src="/vendor/prism-components/prism-json.min.js"></script>
  <script src="/vendor/prism-components/prism-markdown.min.js"></script>
  <script src="/vendor/katex/katex.min.js"></script>
  <script src="/vendor/katex/auto-render.min.js"></script>

  <!-- Application Modules -->
  <script src="/js/storage.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/markdown.js"></script>
  <script src="/js/editor.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
